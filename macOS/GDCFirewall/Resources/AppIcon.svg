<?xml version="1.0" encoding="UTF-8"?>
<!--
  Pictograma GDC Firewall — sursa vectorială unică.
  PNG-urile din AppIcon.appiconset se generează din acest fișier cu
  scripts/make-appicon.sh; nu se editează manual.

  Geometria e cea din antetul paginii gordas.dev/gdc-firewall (scut cu linie
  de mijloc), ca pictograma și site-ul să arate același semn, nu două
  variante apropiate. Paleta e amber/cupru pe placă închisă — standardul
  vizual GDC.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Placa: închisă, cu o trecere abia perceptibilă de sus în jos. -->
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B1F25"/>
      <stop offset="1" stop-color="#0A0C0F"/>
    </linearGradient>

    <!-- Scutul: amber spre cupru, pe diagonală. -->
    <linearGradient id="mark" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFC266"/>
      <stop offset="0.55" stop-color="#FFB347"/>
      <stop offset="1" stop-color="#C87F3E"/>
    </linearGradient>

    <!-- Sticla: un singur reflex difuz sus, nu un luciu de plastic. -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.09"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="plateClip">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <!-- Placa, la raportul de colț folosit de macOS (824 / 185). -->
  <rect x="100" y="100" width="824" height="824" rx="185" ry="185" fill="url(#plate)"/>
  <g clip-path="url(#plateClip)">
    <rect x="100" y="100" width="824" height="480" fill="url(#gloss)"/>
  </g>
  <!-- Muchie de un fir, ca placa să nu se piardă pe fundal închis. -->
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" ry="184.5"
        fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1"/>

  <!--
    Scutul. Glifa e desenată pe o grilă de 24 de unități și scalată o
    singură dată (×26), ca toate grosimile de linie să rămână în raport
    indiferent de dimensiunea la care se exportă.
  -->
  <g transform="translate(200 200) scale(26)"
     fill="none" stroke="url(#mark)"
     stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 2.5 4.5 5.8v6c0 4.6 3.1 8.5 7.5 9.7 4.4-1.2 7.5-5.1 7.5-9.7v-6z"
          fill="#FFB347" fill-opacity="0.07" stroke-width="1.9"/>
    <!-- Linia de mijloc: jumătatea filtrată, jumătatea lăsată să treacă. -->
    <path d="M12 2.5v19" stroke-width="1.15" stroke-opacity="0.42"/>
  </g>
</svg>
